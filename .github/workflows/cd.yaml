name: Snapshot CD
on:
  push:
    branches:
      - main
      - 1.x
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up OSSRH credentials
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN

      - name: Verify snapshot version
        run: |
          VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "Snapshot deployment requires a -SNAPSHOT project version, got: $VERSION"
            exit 1
          fi

      - name: Deploy to OSSRH
        run: ./mvnw -B -ntp deploy
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
