name: Snapshot CD
on:
  push:
    branches:
      - main
      - 1.x
  workflow_dispatch:
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify snapshot lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify snapshot version
        run: |
          VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "Snapshot deployment requires a -SNAPSHOT project version, got: $VERSION"
            exit 1
          fi

          case "${{ github.ref_name }}" in
            main)
              if [[ "$VERSION" != 2.* ]]; then
                echo "main is the 2.x snapshot lane and requires a 2.*-SNAPSHOT version, got: $VERSION"
                exit 1
              fi
              ;;
            1.x)
              if [[ "$VERSION" != 1.* ]]; then
                echo "1.x is the 1.x snapshot lane and requires a 1.*-SNAPSHOT version, got: $VERSION"
                exit 1
              fi
              ;;
            *)
              echo "Snapshot deployments are only supported from main or 1.x, got: ${{ github.ref_name }}"
              exit 1
              ;;
          esac

      - name: Verify snapshot build
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: ./mvnw -B -ntp verify

  deploy:
    name: Deploy snapshot
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up OSSRH credentials
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'
          server-id: ossrh
          server-username: OSSRH_USERNAME
          server-password: OSSRH_TOKEN

      - name: Deploy to OSSRH
        run: ./mvnw -B -ntp -DskipTests deploy
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
