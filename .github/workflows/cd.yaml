name: Snapshot CD
on:
  push:
    branches:
      - main
      - 1.x
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Central Publishing secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          if [[ -z "$CENTRAL_USERNAME" || -z "$CENTRAL_TOKEN" ]]; then
            echo "CENTRAL_USERNAME and CENTRAL_TOKEN repository secrets are required for Central Publishing."
            echo "Create a Sonatype Central Portal user token and save it as those secrets."
            exit 1
          fi

      - name: Set up Central Publishing credentials
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify snapshot version
        run: |
          VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "Snapshot deployment requires a -SNAPSHOT project version, got: $VERSION"
            exit 1
          fi

          case "${{ github.ref_name }}" in
            main)
              if [[ "$VERSION" != 2.* ]]; then
                echo "main is the 2.x snapshot lane and requires a 2.*-SNAPSHOT version, got: $VERSION"
                exit 1
              fi
              ;;
            1.x)
              if [[ "$VERSION" != 1.* ]]; then
                echo "1.x is the 1.x snapshot lane and requires a 1.*-SNAPSHOT version, got: $VERSION"
                exit 1
              fi
              ;;
            *)
              echo "Snapshot deployments are only supported from main or 1.x, got: ${{ github.ref_name }}"
              exit 1
              ;;
          esac

      - name: Deploy to Central Publishing
        run: ./mvnw -B -ntp -DskipTests deploy -P central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_OPTS: >
            --add-opens=java.base/java.util=ALL-UNNAMED
            --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
            --add-opens=java.base/java.text=ALL-UNNAMED
            --add-opens=java.desktop/java.awt.font=ALL-UNNAMED
