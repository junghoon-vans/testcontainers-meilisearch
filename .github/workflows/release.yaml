name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    steps:
      - name: Verify release lane
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          if [[ "$TAG" != v* ]]; then
            echo "Release tags must use the v<version> format, got: $TAG"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be semantic version compatible, got: $TAG"
            exit 1
          fi

          case "$VERSION" in
            2.*)
              TARGET="main"
              ;;
            1.*)
              TARGET="1.x"
              ;;
            *)
              echo "Release tags must be v1.* or v2.*, got: $TAG"
              exit 1
              ;;
          esac

          echo "RELEASE_TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify released commit is on target branch
        run: |
          TAG="${{ github.event.release.tag_name }}"
          git fetch origin "refs/heads/$RELEASE_TARGET:refs/remotes/origin/$RELEASE_TARGET" "refs/tags/$TAG:refs/tags/$TAG"
          if ! git merge-base --is-ancestor "refs/tags/$TAG" "origin/$RELEASE_TARGET"; then
            echo "Release tag $TAG is not contained in origin/$RELEASE_TARGET"
            exit 1
          fi

      - name: Verify Central Publishing secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          if [[ -z "$CENTRAL_USERNAME" || -z "$CENTRAL_TOKEN" ]]; then
            echo "CENTRAL_USERNAME and CENTRAL_TOKEN repository secrets are required for Central Publishing."
            echo "Create a Sonatype Central Portal user token and save it as those secrets."
            exit 1
          fi

      - name: Set up Central Publishing credentials
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set release version
        run: ./mvnw -B -ntp versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Verify release build
        run: ./mvnw -B -ntp verify

      - name: Deploy to Central Publishing
        run: ./mvnw -B -ntp -DskipTests deploy -P central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_OPTS: >
            --add-opens=java.base/java.util=ALL-UNNAMED
            --add-opens=java.base/java.lang.reflect=ALL-UNNAMED
            --add-opens=java.base/java.text=ALL-UNNAMED
            --add-opens=java.desktop/java.awt.font=ALL-UNNAMED
